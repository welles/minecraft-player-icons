license = "MIT"

modLoader = "javafml"
loaderVersion = "[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "Nico Welles"
description = "Shows the faces of the other players on the server floating where they are, or at the edge of the screen pointing the way to them. Toggle with a key, fades out up close."
${icon}File = "assets/${id}/icon.png"
# pixel art, scaled without smoothing
${icon}Blur = false

[[mixins]]
config = "playericons.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
